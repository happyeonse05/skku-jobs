name: update-data
on:
  schedule:
    - cron: "0 21 * * *"   # 매일 오전 6시 (한국시간)
    - cron: "0 2 * * *"    # 매일 오전 11시 (한국시간) 한 번 더
  workflow_dispatch:        # Actions 탭에서 수동 실행 버튼
permissions:
  contents: write
jobs:
  crawl:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests beautifulsoup4 lxml
      - run: python crawler/jobs.py
      - run: python crawler/meals.py
      - name: commit & push
        run: |
          git config user.name "damda-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "🍚 데이터 자동 업데이트"
          git push
